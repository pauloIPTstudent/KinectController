; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = partitions_custom.csv

[env:app_container]
board_build.cmake_extra_args = -DPASTA_PROJETO=app_container
board_upload.offset_address = 0x20000

[env:loader_container]
board_build.cmake_extra_args = -DPASTA_PROJETO=loader_container
board_upload.offset_address = 0x320000
extra_scripts = pre:flash_offset.py

#otadata partition vazia, para evitar que o bootloader iniciar na partição errada
board_build.esp-idf.flash_images =